name: cpp-studio-release

# Builds installable C++ Studio packages.
#   - Every push to cpp-studio/**: the .vsix and CLI .tgz are attached to the workflow run (Actions → run → Artifacts).
#   - Pushing a tag like cpp-studio-v0.2.0: also creates a GitHub Release with both files, and publishes to
#     the VS Code Marketplace / Open VSX / npm for each token present in the repository secrets
#     (VSCE_PAT, OVSX_PAT, NPM_TOKEN). Without tokens, those steps are skipped.

on:
  push:
    branches: ['**']
    tags: ['cpp-studio-v*']
    paths: ['cpp-studio/**', '.github/workflows/cpp-studio-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpp-studio
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/cpp-studio-v')
        run: npm pkg set version="${GITHUB_REF_NAME#cpp-studio-v}"

      - name: Test (walks every lesson with the real compiler)
        run: npm test

      - name: Build installers
        run: node scripts/package.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: cpp-studio-installers
          path: cpp-studio/release/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/cpp-studio-v')
        uses: softprops/action-gh-release@v2
        with:
          files: cpp-studio/release/*

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/cpp-studio-v') && env.VSCE_PAT != ''
        run: npx vsce publish --packagePath release/*.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/cpp-studio-v') && env.OVSX_PAT != ''
        run: npx --yes ovsx publish release/*.vsix -p "$OVSX_PAT"

      - name: Publish CLI to npm
        if: startsWith(github.ref, 'refs/tags/cpp-studio-v') && env.NPM_TOKEN != ''
        run: npm publish release/cpp-studio-cli-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
